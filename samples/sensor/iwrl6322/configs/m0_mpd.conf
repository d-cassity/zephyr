# ============================================================================
# m0_mpd.conf — TI MSPM0 SPI Host reference configuration, MPD mode
#   RADAR_ACQUIRE_RAW_ADC = 0
#   devAppConfig.z_AppCfgCtrl.bits.b1_SmartFeOpMode  = M_ML_DEV_OP_MODE_MPD_ENABLE
#   devAppConfig.z_AppCfgCtrl.bits.b2_DataTxMode     = M_ML_DEV_OUTPUT_MODE_MPD_DATA
#   devAppConfig.z_AppCfgCtrl.bits.b1_MpdDataOutMode = M_ML_DEV_MPD_SIGNAL_OUT_MODE_VERBOSE
# ============================================================================
CONFIG_IWRL6322_DEFAULT_MODE=4

# ============================================================================
# T_ML_DEVICE_APP_CONFIG  (devAppConfig)
# ============================================================================

# devAppConfig.z_AppCfgCtrl.bits.b3_DevAntennaSel = M_ML_DEV_ANTENNA_TYPE_AOP_MODULE
CONFIG_IWRL6322_ANTENNA_TYPE=0

# devAppConfig.z_AppCfgCtrl.bits.b2_GlobalRegion = M_ML_DEV_REGION_TELEC
CONFIG_IWRL6322_REGION=1

# devAppConfig.z_AppCfgCtrl.bits.b1_DeepSleepEntryDis = M_ML_DEV_DEEP_SLEEP_ENABLE (1)
# Disabled temporarily to rule out deep-sleep race; fix B (post-wakeup delay in
# fetch_data) should restore deep sleep support without this override.
CONFIG_IWRL6322_DEEP_SLEEP_ENTRY_DIS=y

# devAppConfig.z_AppCfgCtrl.bits.b1_MpdSigTrigType = M_ML_DEV_MPD_SIGNAL_OUT_TRIGTYPE_PULSE
CONFIG_IWRL6322_MPD_SIG_TRIG_TYPE=n

# devAppConfig.z_AppCfgCtrl.bits.b1_MpdAutoBootMode = M_ML_DEV_MPD_AUTO_BOOT_MODE_DISABLE
CONFIG_IWRL6322_MPD_AUTO_BOOT_MODE=n

# devAppConfig.z_AppCfgCtrl.bits.b1_TrigBootCal = M_ML_FE_FACTORY_CAL_TRIG_ENABLE
CONFIG_IWRL6322_TRIG_BOOT_CAL=y

# devAppConfig.z_AppCfgCtrl.bits.b1_XtalLessModeEna = M_ML_DEV_XTAL_LESS_MODE_DISABLE
CONFIG_IWRL6322_XTAL_LESS_MODE=n

# devAppConfig.w_MpdSigOutToDsHoldTime = 500  (units: 10 us/LSB → 5 ms)
# Increased from 12 (120 us): 120 us too short for Zephyr workqueue to assert WAKE_UP
# before device enters deep sleep; 5 ms gives workqueue enough margin.
CONFIG_IWRL6322_MPD_HOLDTIME_10US=500

# devAppConfig.h_FeCalibCtrl — all calibrations enabled
# RC32K | RC10M | APLL | SYNTH | PD | LODIST | IFA | RXGAIN | TXPOWER
CONFIG_IWRL6322_FE_CALIB_CTRL=0x01FF

# NOTE: b1_HilEnable, b1_JtagEnable, b1_GpioMarkerEna, b1_CzCwModeEna, b1_RfLdoBypass
# are hardcoded to disabled in the driver and are not Kconfig options.

# ============================================================================
# T_ML_SENS_MPD_PROF_CFG  (mpdprofcfg)
# ============================================================================

# mpdprofcfg.c_DetectionMode = M_ML_MPD_DETECTION_4VIRTANT_3D
CONFIG_IWRL6322_MPD_DETECTION_MODE=4

# mpdprofcfg.c_MaxRange = M_ML_MPD_MAX_RANGE_8M
CONFIG_IWRL6322_MPD_MAX_RANGE=1

# mpdprofcfg.c_MotionAndDetecSensvty = (M_ML_MPD_MOTION_SENS_LEVEL3 | M_ML_MPD_DETECT_SENS_LEVEL5 << 4)
CONFIG_IWRL6322_MPD_MOTION_SENSITIVITY=3
CONFIG_IWRL6322_MPD_DETECTION_SENSITIVITY=5

# mpdprofcfg.h_MpdCtrl = (M_ML_MPD_SNR_BOOST_LEVEL1_ENABLED | M_ML_MPD_STATIC_OBJ_REMOVAL_ENABLE)
CONFIG_IWRL6322_MPD_SNR_BOOST=1
CONFIG_IWRL6322_MPD_STATIC_REMOVAL=y

# mpdprofcfg.h_NumOfFrames = 0  (infinite)
CONFIG_IWRL6322_MPD_NUM_FRAMES=0

# mpdprofcfg.w_FramePeriodicity = 200  (200 ms)
CONFIG_IWRL6322_MPD_FRAME_PERIOD_MS=200

# mpdprofcfg.xc_AdvCfarCfg = 0  (no CFAR offset)
CONFIG_IWRL6322_MPD_ADV_CFAR_CFG=0

# ============================================================================
# T_ML_SENS_MPD_ZONE_CFG  (p_sensMpdZoneCfg)
# ============================================================================

# p_sensMpdZoneCfg.c_ZoneCoordSelCtrl = M_ML_MPD_ZONE_TYPE_CORD_CARTESIAN  (Kconfig default)
# p_sensMpdZoneCfg.h_ZoneType / zone boundaries — runtime attributes, set via sensor_attr_set()
# p_sensMpdZoneCfg.xh_SensPosXRange / YTheta / Z / tilts — runtime attributes, set via sensor_attr_set()

# p_sensMpdZoneCfg.c_NumSelectedZones = 1
CONFIG_IWRL6322_MPD_NUM_ZONES=1

# ============================================================================
# T_ML_SENS_START_STOP_CFG  (stCfg)
# ============================================================================

# stCfg.c_RunCalCtrl = M_ML_SENS_RUN_CAL_TRIG_ENABLE
CONFIG_IWRL6322_RUN_CAL_CTRL=1

# stCfg.c_RunCalTrigInterval = 5  (recalibrate every 5 frames)
CONFIG_IWRL6322_RUN_CAL_TRIG_INTERVAL=5

# stCfg.c_SensorStartStopCtrl = 0xAA  (handled by driver start sequence)
# stCfg.c_FlashSensCfgData = DISABLE  (Kconfig default n)

# ============================================================================
# Power saving
#   driver: toggles ml_devCtrl (ACTIVE/LOW) around data fetches
# ============================================================================
CONFIG_IWRL6322_POWER_SAVING=y

CONFIG_IWRL6322_DEBUG_LOG=y
