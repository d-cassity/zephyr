# ============================================================================
# m0_adc.conf — TI MSPM0 SPI Host reference configuration, RAW ADC mode
#   RADAR_ACQUIRE_RAW_ADC = 1
#   devAppConfig.z_AppCfgCtrl.bits.b1_SmartFeOpMode = M_ML_DEV_OP_MODE_FE_ENABLE
#   devAppConfig.z_AppCfgCtrl.bits.b2_DataTxMode    = M_ML_DEV_OUTPUT_MODE_RAW_ADC
# ============================================================================
CONFIG_IWRL6322_DEFAULT_MODE=1

# ============================================================================
# T_ML_DEVICE_APP_CONFIG  (devAppConfig)
# ============================================================================

# devAppConfig.z_AppCfgCtrl.bits.b3_DevAntennaSel = M_ML_DEV_ANTENNA_TYPE_AOP_MODULE
CONFIG_IWRL6322_ANTENNA_TYPE=0

# devAppConfig.z_AppCfgCtrl.bits.b2_GlobalRegion = M_ML_DEV_REGION_FCC
CONFIG_IWRL6322_REGION=0

# devAppConfig.z_AppCfgCtrl.bits.b1_DeepSleepEntryDis = M_ML_DEV_DEEP_SLEEP_DISABLE (0)
# bit=0 → deep sleep entry IS enabled
CONFIG_IWRL6322_DEEP_SLEEP_ENTRY_DIS=n

# devAppConfig.z_AppCfgCtrl.bits.b1_MpdSigTrigType = M_ML_DEV_MPD_SIGNAL_OUT_TRIGTYPE_PULSE
CONFIG_IWRL6322_MPD_SIG_TRIG_TYPE=n

# devAppConfig.z_AppCfgCtrl.bits.b1_MpdAutoBootMode = M_ML_DEV_MPD_AUTO_BOOT_MODE_DISABLE
CONFIG_IWRL6322_MPD_AUTO_BOOT_MODE=n

# devAppConfig.z_AppCfgCtrl.bits.b1_TrigBootCal = M_ML_FE_FACTORY_CAL_TRIG_DISABLE
CONFIG_IWRL6322_TRIG_BOOT_CAL=n

# devAppConfig.z_AppCfgCtrl.bits.b1_XtalLessModeEna = M_ML_DEV_XTAL_LESS_MODE_DISABLE
CONFIG_IWRL6322_XTAL_LESS_MODE=n

# devAppConfig.w_MpdSigOutToDsHoldTime = 12  (units: 10 us/LSB → 120 us)
CONFIG_IWRL6322_MPD_HOLDTIME_10US=12

# devAppConfig.h_FeCalibCtrl — all calibrations enabled
# RC32K | RC10M | APLL | SYNTH | PD | LODIST | IFA | RXGAIN | TXPOWER
CONFIG_IWRL6322_FE_CALIB_CTRL=0x01FF

# NOTE: b1_HilEnable, b1_JtagEnable, b1_GpioMarkerEna, b1_CzCwModeEna, b1_RfLdoBypass
# are hardcoded to disabled in the driver and are not Kconfig options.

# ============================================================================
# T_ML_FE_CHIRP_PROF_CONFIG  (profileCfg)  — RAW ADC mode
# ============================================================================

# profileCfg.c_AdcSampRate = 16  → 400 MHz / (16 * 2) = 12.5 MSPS
CONFIG_IWRL6322_FE_ADC_SAMP_RATE=16

# profileCfg.c_NumVirtualAntennas = 4
CONFIG_IWRL6322_FE_NUM_VIRTUAL_ANT=4

# profileCfg.h_ChirpTxRxChEnaSel = 0xA965
CONFIG_IWRL6322_FE_TXRX_CH_ENA=0xA965

# profileCfg.h_NumOfAdcSamples = 32
CONFIG_IWRL6322_FE_NUM_ADC_SAMPLES=32

# profileCfg.c_ChirpAdcStartSkipSamp = 54
CONFIG_IWRL6322_FE_ADC_SKIP_SAMP=54

# profileCfg.h_ChirpRampEndTime = 246  (24.6 us)
CONFIG_IWRL6322_FE_RAMP_END_TIME=246

# profileCfg.h_ChirpIdleTime = 531  (53.1 us)
CONFIG_IWRL6322_FE_IDLE_TIME=531

# profileCfg.w_ChirpRfFreqStart = 0x0000BE00  (~57 GHz)
CONFIG_IWRL6322_FE_RF_FREQ_START=0x0000BE00

# profileCfg.xh_ChirpRfFreqSlope = 4912  (~140 MHz/us up-sweep)
CONFIG_IWRL6322_FE_RF_FREQ_SLOPE=4912

# profileCfg.xh_TxStartTime = 1  (20 ns)
CONFIG_IWRL6322_FE_TX_START_TIME=1

# profileCfg.c_ChirpRxHpfSel = M_FE_HPF_CORNER_350KHZ  (normal operation; 175kHz for SAT_TEST)
CONFIG_IWRL6322_FE_HPF_CORNER=1

# profileCfg.c_CalRxGainSel = 42 dB  (normal operation; 44 dB for SAT_TEST)
CONFIG_IWRL6322_FE_CAL_RX_GAIN=42

# profileCfg.c_CalTxBackOffSel = 0  (0 dB, no back-off)
CONFIG_IWRL6322_FE_CAL_TX_BACKOFF=0

# profileCfg.c_InterChirpPsOvrd = 0  (default inter-chirp power save, no override)

# ============================================================================
# T_ML_FE_CHIRP_FRAME_CONFIG  (frameCfg)  — RAW ADC mode
# ============================================================================

# frameCfg.c_NumOfChirpsAccum = 0  (accumulation disabled)
CONFIG_IWRL6322_FE_CHIRPS_ACCUM=0

# frameCfg.h_NumOfChirpsInBurst = 4
CONFIG_IWRL6322_FE_CHIRPS_PER_BURST=4

# frameCfg.w_BurstIdleTime = 8011  (801.1 us)
CONFIG_IWRL6322_FE_BURST_IDLE_TIME=8011

# frameCfg.h_NumOfBurstsInFrame = 1
CONFIG_IWRL6322_FE_BURSTS_PER_FRAME=1

# frameCfg.h_NumOfFrames = 16
CONFIG_IWRL6322_FE_NUM_FRAMES=16

# frameCfg.w_FramePeriodicity = 200  (200 ms)
CONFIG_IWRL6322_FE_FRAME_PERIOD_MS=200

# ============================================================================
# T_ML_SENS_START_STOP_CFG  (stCfg)
# ============================================================================

# stCfg.c_RunCalCtrl = M_ML_SENS_RUN_CAL_TRIG_ENABLE
CONFIG_IWRL6322_RUN_CAL_CTRL=1

# stCfg.c_RunCalTrigInterval = 5  (recalibrate every 5 frames)
CONFIG_IWRL6322_RUN_CAL_TRIG_INTERVAL=5

# stCfg.c_SensorStartStopCtrl = 0xAA  (handled by driver start sequence)
# stCfg.c_FlashSensCfgData = DISABLE  (Kconfig default n)

# ============================================================================
# Power saving
#   driver: toggles ml_devCtrl (ACTIVE/LOW) around data fetches
# ============================================================================
CONFIG_IWRL6322_POWER_SAVING=y
