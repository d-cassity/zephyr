# LP-EM-CC2340R53 board configuration for the IWRL6322 sensor sample.
#
# The CC2340R53 has 64 KB RAM.  Disable mbedTLS (pulled in by the board
# defconfig for BLE) and reduce buffer sizes to fit within RAM.

CONFIG_IWRL6322=y
CONFIG_IWRL6322_DEFAULT_MODE=0

# Disable mbedTLS — not needed for the IWRL6322 driver
CONFIG_MBEDTLS=n
CONFIG_MBEDTLS_PSA_CRYPTO_C=n

# Disable power management to prevent SPI pin sleep state from causing
# inter-transaction latency on the CC2340R53.
CONFIG_PM=n

# The board defaults enable device runtime PM (lpf3_common/Kconfig.defconfig)
# with a 768-byte dedicated work queue stack, which overflows in this build.
CONFIG_PM_DEVICE_RUNTIME_DEDICATED_WQ_STACK_SIZE=2048

# Increase SPI response timeout — default 10ms is too tight at 1MHz
CONFIG_IWRL6322_API_TIMEOUT_MS=255

# Reduce buffers to fit logging in 64KB RAM
CONFIG_IWRL6322_MAX_PAYLOAD_BYTES=512
CONFIG_IWRL6322_WORK_QUEUE_STACK_SIZE=4096

# Enable logging for debugging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_IWRL6322_DEBUG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
