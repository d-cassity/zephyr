CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_IWRL6322=y

CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_BASE64=y
CONFIG_IWRL6322_MAX_PAYLOAD_BYTES=32768
CONFIG_IWRL6322_FE_FRAME_PERIOD_MS=1000

# Increase main thread stack — the TI library allocates several large
# packet buffers on the call stack during SPI transfers.
CONFIG_MAIN_STACK_SIZE=4096

# RTIO / async sensor read — enables sensor_stream() + sensor_decoder_api.
# The IWRL6322 driver is RTIO-only; sensor_sample_fetch is not supported.

CONFIG_RTIO=y
CONFIG_RTIO_WORKQ=y
CONFIG_RTIO_WORKQ_POOL_ITEMS=4
CONFIG_RTIO_WORKQ_THREADS_POOL_STACK_SIZE=1024

CONFIG_NO_OPTIMIZATIONS=y
