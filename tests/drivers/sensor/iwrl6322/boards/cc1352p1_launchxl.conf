# Additional Kconfig fragments applied when building for cc1352p1_launchxl.
# This enables the real IWRL6322 driver for the hardware integration tests.

CONFIG_IWRL6322=y

CONFIG_BOOT_BANNER=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HW_STACK_PROTECTION=y
